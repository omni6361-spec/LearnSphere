name: Verify public course-history display

on:
  push:
    branches:
      - main1
    paths:
      - .github/workflows/verify-public-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CSV parser
        run: python -m pip install "pandas>=2.1,<3"
      - name: Validate public pre-cutoff course display
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import pandas as pd
          from release_data import ensure_release_history

          with tempfile.TemporaryDirectory() as temp:
              data = Path(temp)
              assert ensure_release_history(data)
              out = data / "history_display.csv"
              history = pd.read_csv(out, dtype={"userid_DI": str, "course_id": str})
              assert history.columns.tolist() == ["userid_DI", "course_id"]
              assert len(history) > 0, "No pre-cutoff courses were found"
              assert not history[["userid_DI", "course_id"]].isna().any().any()
              assert history.userid_DI.str.fullmatch(r"Learner \d+").all()
              assert not history.duplicated().any()
              print("PASS: pre-cutoff course display available")
              print("Unique pseudonymous learners with history:", history.userid_DI.nunique())
              print("Unique learner-course selections:", len(history))
              from urllib.request import Request, urlopen
              from io import BytesIO
              release_csv = "https://github.com/omni6361-spec/LearnSphere/releases/download/learnsphere-data-v1/recommendations.csv"
              request = Request(release_csv, headers={"User-Agent": "LearnSphere-HistoryCheck/1.0"})
              with urlopen(request, timeout=90) as response:
                  rec = pd.read_csv(BytesIO(response.read()), dtype={"userid_DI": str, "course_id": str})
              history_users = set(history.userid_DI)
              rec_users = set(rec.userid_DI)
              print("History / recommendations common IDs:", len(history_users & rec_users))
              print("First recommendation IDs:", sorted(rec_users)[:12])
              print("First history IDs:", sorted(history_users)[:12])
              for uid in ["Learner 00001", "Learner 00006"]:
                  print("Learner detail:", repr(uid), "history", sum(history.userid_DI==uid),
                        "recommended", sum(rec.userid_DI==uid))
              assert rec_users == history_users, "Learner IDs do not match between histories and recommendations"
          PY
