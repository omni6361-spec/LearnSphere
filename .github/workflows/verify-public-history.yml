name: Verify public course-history display

on:
  push:
    branches:
      - main1
    paths:
      - .github/workflows/verify-public-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CSV parser
        run: python -m pip install "pandas>=2.1,<3"
      - name: Validate public pre-cutoff course display
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import pandas as pd
          from release_data import ensure_release_history

          with tempfile.TemporaryDirectory() as temp:
              data = Path(temp)
              assert ensure_release_history(data)
              out = data / "history_display.csv"
              history = pd.read_csv(out, dtype={"userid_DI": str, "course_id": str})
              assert history.columns.tolist() == ["userid_DI", "course_id"]
              assert len(history) > 0, "No pre-cutoff courses were found"
              assert not history[["userid_DI", "course_id"]].isna().any().any()
              assert history.userid_DI.str.fullmatch(r"Learner \d+").all()
              assert not history.duplicated().any()
              print("PASS: pre-cutoff course display available")
              print("Unique pseudonymous learners with history:", history.userid_DI.nunique())
              print("Unique learner-course selections:", len(history))
          PY
